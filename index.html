<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDITOR Lab - direct free AI assistant">
  <title>مختبر EDITOR</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050b14;
      --panel: #0d1626;
      --panel-strong: #111d2f;
      --panel-soft: #16233a;
      --line: #2d3f5d;
      --text: #edf6ff;
      --muted: #9bb0ca;
      --blue: #3b82f6;
      --blue-soft: #1d4ed8;
      --green: #22c55e;
      --danger: #ef4444;
      --shadow: rgba(0,0,0,0.35);
    }

    * { box-sizing: border-box; }
    html, body, #app { width: 100%; height: 100%; margin: 0; }
    body {
      background: linear-gradient(180deg, #050b14 0%, #091321 100%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      overflow: hidden;
    }

    button, input, textarea { font: inherit; }

    .app {
      height: 100%;
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background: rgba(13, 22, 38, 0.92);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: 0 24px 60px var(--shadow);
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(180deg, #0c1729 0%, #0d1b2d 100%);
      border-bottom: 1px solid var(--line);
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f8fafc 0%, #94a3b8 100%);
      color: #0f172a;
      font-weight: 900;
      font-size: 22px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 8px 18px rgba(14,116,144,0.2);
    }

    .brand {
      flex: 1;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: .02em;
    }

    .header-status {
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toolbar button,
    .composer button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      transition: 0.15s ease;
      font-weight: 700;
    }

    .toolbar button:hover,
    .composer button:hover {
      background: #22365d;
      transform: translateY(-1px);
    }

    .toolbar button:disabled,
    .composer button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .empty {
      margin: auto 0;
      text-align: center;
      color: var(--muted);
      padding: 24px 18px 0;
    }

    .empty h2 {
      font-size: clamp(1.3rem, 2vw, 2rem);
      margin: 0 0 10px;
      color: var(--text);
    }

    .empty p {
      margin: 8px 0;
      line-height: 1.8;
    }

    .hint {
      font-size: 12px;
      opacity: 0.8;
    }

    .key {
      display: inline-block;
      direction: ltr;
      word-break: break-all;
      font-family: ui-monospace, SFMono-Regular, "Consolas", monospace;
      font-size: 11px;
      color: #dbeafe;
      margin-top: 6px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 16px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.12);
      line-height: 1.8;
      word-break: break-word;
      white-space: normal;
    }

    .msg.user {
      margin-left: auto;
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      border-top-right-radius: 6px;
    }

    .msg.assistant {
      margin-right: auto;
      background: #152338;
      border: 1px solid var(--line);
      border-top-left-radius: 6px;
    }

    .msg-head {
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: .04em;
      text-transform: uppercase;
      opacity: .92;
    }

    .msg.user .msg-head { color: #dbeafe; }
    .msg.assistant .msg-head { color: #86efac; }

    .msg-body {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.97rem;
    }

    .composer {
      display: flex;
      gap: 10px;
      padding: 14px 18px 18px;
      border-top: 1px solid var(--line);
      background: rgba(9, 15, 24, 0.9);
    }

    .composer textarea {
      flex: 1;
      min-height: 52px;
      max-height: 180px;
      resize: vertical;
      background: #101c2e;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
    }

    .composer textarea:focus {
      border-color: rgba(59,130,246,0.8);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    .send-btn {
      min-width: 110px;
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%) !important;
      border-color: rgba(96,165,250,0.7) !important;
      color: #eff6ff !important;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: rgba(15,23,42,0.95);
      color: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 12px;
      box-shadow: 0 16px 32px rgba(0,0,0,0.28);
      z-index: 999;
    }

    @media (max-width: 700px) {
      .app { max-width: 100%; }
      .msg { max-width: 92%; }
      .toolbar { gap: 6px; }
      .toolbar button { padding: 8px 9px; font-size: 12px; }
      .composer { flex-direction: column; }
      .send-btn { min-width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    (() => {
      'use strict';

      const STORE_KEY = 'editor-direct-ai-v2';
      const AI_URL = 'https://gen.pollinations.ai/v1/chat/completions';
      const $ = (selector, root = document) => root.querySelector(selector);
      const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;

      const state = {
        lang: 'ar',
        messages: [],
        busy: false,
        provider: 'idle',
        lastError: ''
      };

      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
        if (saved && Array.isArray(saved.messages)) state.messages = saved.messages.slice(-50);
        if (saved && ['ar', 'en'].includes(saved.lang)) state.lang = saved.lang;
      } catch (_) {}

      const ar = () => state.lang === 'ar';
      const t = (arText, enText) => ar() ? arText : enText;

      const save = () => {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify({ lang: state.lang, messages: state.messages.slice(-50) }));
        } catch (_) {}
      };

      const escapeHtml = (value) => String(value ?? '').replace(/[&<>\"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));

      const toast = (text) => {
        document.querySelector('.toast')?.remove();
        const node = document.createElement('div');
        node.className = 'toast';
        node.textContent = text;
        document.body.appendChild(node);
        setTimeout(() => node.remove(), 2600);
      };

      function render() {
        const messagesHtml = state.messages.length
          ? state.messages.map((msg) => `
            <article class="msg ${msg.role}">
              <div class="msg-head">${msg.role === 'user' ? t('أنت', 'You') : t('الذكاء الاصطناعي', 'AI')}</div>
              <div class="msg-body">${escapeHtml(msg.content).replace(/\n/g, '<br>')}</div>
            </article>
          `).join('')
          : `
            <div class="empty">
              <h2>${t('مرحباً بك في مختبر EDITOR', 'Welcome to EDITOR Lab')}</h2>
              <p>${t('تحدث مع الذكاء الاصطناعي المجاني مباشرةً من المتصفح.', 'Chat with the free AI directly from the browser.')}</p>
              <div class="hint">${t('المحرك الحالي: Pollinations AI', 'Current engine: Pollinations AI')}</div>
              <div class="key">${t('التجربة سريعة، وآمنة، ودون تسجيل.', 'Fast, private and no signup required.')}</div>
            </div>
          `;

        const statusText = state.provider === 'pollinations'
          ? t('متصل', 'Connected')
          : (state.busy ? t('جاري التفكير...', 'Thinking...') : t('جاهز', 'Ready'));

        const template = `
          <div class="app">
            <header>
              <div class="logo">✦</div>
              <div class="brand">${t('مختبر EDITOR', 'EDITOR Lab')}</div>
              <div class="toolbar">
                <button type="button" data-action="language">${t('EN / عربي', 'AR / English')}</button>
                <button type="button" data-action="clear">${t('مسح', 'Clear')}</button>
                <button type="button" data-action="export">${t('تصدير', 'Export')}</button>
              </div>
              <div class="header-status">● ${statusText}</div>
            </header>

            <div id="messages" class="messages">${messagesHtml}</div>

            <div class="composer">
              <textarea id="prompt" rows="1" placeholder="${t('اكتب رسالتك...', 'Type your message...')}"></textarea>
              <button type="button" class="send-btn" data-action="send" ${state.busy ? 'disabled' : ''}>${t('إرسال', 'Send')}</button>
            </div>
          </div>
        `;

        $('#app').innerHTML = template;
        bind();

        const msgBox = $('#messages');
        if (msgBox) msgBox.scrollTop = msgBox.scrollHeight;
      }

      function bind() {
        const sendBtn = document.querySelector('[data-action="send"]');
        const promptEl = $('#prompt');

        document.querySelectorAll('[data-action]').forEach((btn) => {
          btn.onclick = async () => {
            const action = btn.dataset.action;
            if (action === 'language') {
              state.lang = ar() ? 'en' : 'ar';
              save();
              render();
              return;
            }
            if (action === 'clear') {
              state.messages = [];
              save();
              render();
              return;
            }
            if (action === 'export') {
              const text = state.messages.map((m) => `${m.role}: ${m.content}`).join('\n\n');
              const blob = new Blob([text || t('لا توجد رسائل.', 'No messages yet.')], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `editor-chat-${Date.now()}.txt`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              URL.revokeObjectURL(url);
              toast(t('تم تصدير المحادثة.', 'Chat exported.'));
              return;
            }
            if (action === 'send') {
              await send();
            }
          };
        });

        if (promptEl) {
          promptEl.onkeydown = (event) => {
            if (event.key === 'Enter' && !event.shiftKey) {
              event.preventDefault();
              send();
            }
          };
        }

        if (sendBtn) {
          sendBtn.onclick = async () => send();
        }
      }

      async function fetchWithTimeout(url, options = {}, timeoutMs = 25000) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const res = await fetch(url, {
            ...options,
            signal: controller.signal,
            headers: {
              Accept: 'application/json',
              ...(options.headers || {})
            }
          });

          const text = await res.text();
          if (!res.ok) {
            let info = text || `HTTP ${res.status}`;
            throw new Error(info.slice(0, 240));
          }

          try {
            return JSON.parse(text);
          } catch (_err) {
            return { raw: text };
          }
        } finally {
          clearTimeout(timer);
        }
      }

      async function askFreeAI(prompt) {
        const history = state.messages.slice(-10).map((msg) => ({
          role: msg.role === 'user' ? 'user' : 'assistant',
          content: msg.content
        }));

        const systemText = ar()
          ? 'أنت مساعد عربي مختصر ودقيق. أجب مباشرة فقط وبأسلوب واضح وبعكس الدقة. لا تذكر أنك نموذج أو تعطي مقدمات ترويجية.'
          : 'You are a direct, helpful, and concise assistant. Reply clearly and accurately without promotional preambles or self-introduction.';

        const payload = {
          model: 'gemini-3.5-flash',
          messages: [
            { role: 'system', content: systemText },
            ...history,
            { role: 'user', content: prompt }
          ],
          temperature: 0.7,
          max_tokens: 768
        };

        const data = await fetchWithTimeout(AI_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }, 25000);

        const answer = data?.choices?.[0]?.message?.content || data?.output || data?.response || data?.raw;
        const text = typeof answer === 'string' ? answer.trim() : '';

        if (!text) {
          throw new Error(t('لم يتم الحصول على رد صحيح من الخادم.', 'The server returned an invalid response.'));
        }

        state.provider = 'pollinations';
        return text;
      }

      async function send() {
        const input = $('#prompt');
        const prompt = (input?.value || '').trim();

        if (!prompt || state.busy) return;

        state.busy = true;
        state.lastError = '';
        state.messages.push({ id: uid(), role: 'user', content: prompt });
        state.messages.push({ id: uid(), role: 'assistant', content: t('جاري التفكير...', 'Thinking...') });
        save();
        render();

        try {
          const answer = await askFreeAI(prompt);
          state.messages[state.messages.length - 1].content = answer;
        } catch (error) {
          const msg = error?.message || String(error || 'Unknown error');
          state.lastError = msg;
          state.messages[state.messages.length - 1].content = t(
            `تعذّر الاتصال بالخادم المجاني.\n\n${msg}`,
            `The free AI server is unavailable.\n\n${msg}`
          );
          toast(t('فشل الاتصال بالسيرفر المجاني.', 'Free AI server connection failed.'));
        } finally {
          state.busy = false;
          save();
          render();
        }
      }

      render();
    })();
  </script>
</body>
</html>
