<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EDITOR Lab - direct free AI assistant" />
    <title>مختبر EDITOR</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #08101d; color: #e2e8f0; font-family: Arial, sans-serif; }
      #root { min-height: 100vh; }
      .standalone { max-width: 900px; min-height: 100vh; margin: auto; padding: 24px 16px; display: flex; flex-direction: column; gap: 16px; }
      .card { background: #0f172a; border: 1px solid #243650; border-radius: 18px; padding: 20px; box-shadow: 0 20px 40px rgba(0,0,0,.3); }
      h1 { margin: 0 0 6px; font-size: 26px; } p { color: #94a3b8; line-height: 1.7; }
      .messages { flex: 1; min-height: 45vh; max-height: 60vh; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
      .message { padding: 12px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.7; }
      .user { background: #2563eb; align-self: flex-start; max-width: 85%; }
      .assistant { background: #1e293b; align-self: stretch; }
      .composer { display: flex; gap: 10px; }
      textarea { flex: 1; min-height: 76px; resize: vertical; border: 1px solid #334155; border-radius: 12px; padding: 12px; background: #08101d; color: #fff; font: inherit; }
      button { border: 0; border-radius: 10px; padding: 0 18px; background: #2563eb; color: #fff; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      .status { color: #7dd3fc; font-size: 13px; min-height: 20px; }
      @media (max-width: 600px) { .composer { flex-direction: column; } button { min-height: 44px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const root = document.getElementById('root');
        if (!root) return;

        if (location.protocol !== 'file:') {
          const script = document.createElement('script');
          script.type = 'module';
          script.src = new URL('./src/main.tsx', document.baseURI).href;
          script.onerror = () => {
            root.innerHTML = '<main class="standalone"><section class="card"><h1>مختبر EDITOR</h1><p>تعذر تحميل تطبيق React. شغّل المشروع باستخدام npm run dev.</p></section></main>';
          };
          document.body.appendChild(script);
          return;
        }

        root.innerHTML = `
          <main class="standalone">
            <section class="card">
              <h1>مختبر EDITOR</h1>
              <p>محادثة ذكاء اصطناعي حقيقية تعمل مباشرة دون مفتاح تفعيل.</p>
              <div id="messages" class="messages"></div>
              <div id="status" class="status"></div>
              <div class="composer">
                <textarea id="prompt" placeholder="اكتب رسالتك هنا..."></textarea>
                <button id="send" type="button">إرسال</button>
              </div>
            </section>
          </main>
        `;

        const messages = document.getElementById('messages');
        const prompt = document.getElementById('prompt');
        const send = document.getElementById('send');
        const status = document.getElementById('status');
        if (!messages || !prompt || !send || !status) return;

        function addMessage(text, type) {
          const item = document.createElement('div');
          item.className = 'message ' + type;
          item.textContent = text;
          messages.appendChild(item);
          messages.scrollTop = messages.scrollHeight;
          return item;
        }

        async function askAI() {
          const text = prompt.value.trim();
          if (!text || send.disabled) return;
          prompt.value = '';
          addMessage(text, 'user');
          send.disabled = true;
          status.textContent = 'جاري التفكير...';
          try {
            const response = await fetch('https://gen.pollinations.ai/v1/chat/completions', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify({
                model: 'openai-fast',
                messages: [
                  { role: 'system', content: 'أجب بالعربية مباشرة وبوضوح ودقة. لا تذكر مفاتيح API ولا تقدم مقدمات ترويجية.' },
                  { role: 'user', content: text }
                ],
                temperature: 0.7,
                max_tokens: 1024
              })
            });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            const data = await response.json();
            const answer = data?.choices?.[0]?.message?.content;
            if (!answer) throw new Error('Empty response');
            addMessage(answer, 'assistant');
            status.textContent = 'متصل ويعمل دون مفتاح تفعيل.';
          } catch (error) {
            addMessage('تعذر الاتصال بخدمة الذكاء الاصطناعي المجانية. تحقق من اتصال الإنترنت أو شغّل المشروع عبر npm run dev.', 'assistant');
            status.textContent = 'فشل الاتصال بالخدمة الخارجية.';
          } finally {
            send.disabled = false;
            prompt.focus();
          }
        }

        send.addEventListener('click', askAI);
        prompt.addEventListener('keydown', event => {
          if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            askAI();
          }
        });
        prompt.focus();
      })();
    </script>
  </body>
</html>
