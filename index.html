<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDITOR Lab - direct free AI assistant">
  <title>مختبر EDITOR</title>
  <style>
    :root{color-scheme:dark;--bg:#050b14;--panel:#0d1626;--soft:#16233a;--line:#2d3f5d;--text:#edf6ff;--muted:#9bb0ca}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{background:linear-gradient(180deg,#050b14,#091321);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;overflow:hidden}button,input,textarea{font:inherit}.app{height:100%;max-width:1100px;margin:auto;display:flex;flex-direction:column;background:rgba(13,22,38,.94);border-left:1px solid var(--line);border-right:1px solid var(--line)}header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:#0c1729;border-bottom:1px solid var(--line)}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#f8fafc,#94a3b8);color:#0f172a;font-weight:900;font-size:22px}.brand{flex:1;font-weight:800}.status{font-size:12px;color:#86efac;font-weight:700}.toolbar{display:flex;gap:8px}.toolbar button,.composer button{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:700}.toolbar button:hover,.composer button:hover{background:#22365d}.toolbar button:disabled,.composer button:disabled{opacity:.5;cursor:not-allowed}.messages{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px}.empty{margin:auto 0;text-align:center;color:var(--muted);padding:24px}.empty h2{color:var(--text)}.msg{max-width:82%;padding:12px 14px;border-radius:16px;line-height:1.8;word-break:break-word;white-space:pre-wrap}.msg.user{margin-left:auto;background:#2563eb;border-top-right-radius:6px}.msg.assistant{margin-right:auto;background:#152338;border:1px solid var(--line);border-top-left-radius:6px}.msg-head{font-size:11px;font-weight:800;margin-bottom:6px}.msg.user .msg-head{color:#dbeafe}.msg.assistant .msg-head{color:#86efac}.composer{display:flex;gap:10px;padding:14px 18px 18px;border-top:1px solid var(--line);background:rgba(9,15,24,.9)}.composer textarea{flex:1;min-height:52px;max-height:180px;resize:vertical;background:#101c2e;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:0}.composer textarea:focus{border-color:#3b82f6}.send-btn{min-width:110px;background:linear-gradient(180deg,#60a5fa,#2563eb)!important;color:#eff6ff!important}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(15,23,42,.97);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:12px;box-shadow:0 16px 32px #0008;z-index:999}@media(max-width:700px){.msg{max-width:92%}.toolbar{gap:5px}.toolbar button{padding:8px 9px;font-size:12px}.composer{flex-direction:column}.send-btn{min-width:100%}}
  </style>
</head>
<body><div id="app"></div>
<script type="module">
(()=>{
'use strict';
const STORE_KEY='editor-direct-ai-v3';
// Use the public OpenAI-compatible endpoint, but try compatible free models when a model is unavailable.
const AI_URL='https://gen.pollinations.ai/v1/chat/completions';
const MODELS=['openai-fast','openai','gemini-2.5-flash','mistral'];
const $=(s,r=document)=>r.querySelector(s);const uid=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`;
const state={lang:'ar',messages:[],busy:false,provider:'idle'};
try{const saved=JSON.parse(localStorage.getItem(STORE_KEY)||'{}');if(Array.isArray(saved.messages))state.messages=saved.messages.slice(-50);if(['ar','en'].includes(saved.lang))state.lang=saved.lang}catch{}
const ar=()=>state.lang==='ar';const t=(a,e)=>ar()?a:e;
const save=()=>{try{localStorage.setItem(STORE_KEY,JSON.stringify({lang:state.lang,messages:state.messages.slice(-50)}))}catch{}};
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=text=>{document.querySelector('.toast')?.remove();const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.appendChild(n);setTimeout(()=>n.remove(),3500)};
function render(){const messages=state.messages.length?state.messages.map(m=>`<article class="msg ${m.role}"><div class="msg-head">${m.role==='user'?t('أنت','You'):t('الذكاء الاصطناعي','AI')}</div><div>${escapeHtml(m.content)}</div></article>`).join(''):`<div class="empty"><h2>${t('مرحباً بك في مختبر EDITOR','Welcome to EDITOR Lab')}</h2><p>${t('تحدث مع الذكاء الاصطناعي المجاني مباشرةً من المتصفح.','Chat with the free AI directly from the browser.')}</p><small>${t('المحركات المجانية: Pollinations AI (مع إعادة المحاولة التلقائية)','Free engines: Pollinations AI (with automatic retries)')}</small></div>`;const status=state.busy?t('جاري التفكير...','Thinking...'):state.provider==='pollinations'?t('متصل','Connected'):t('جاهز','Ready');$('#app').innerHTML=`<div class="app"><header><div class="logo">✦</div><div class="brand">${t('مختبر EDITOR','EDITOR Lab')}</div><div class="toolbar"><button data-action="language">${t('EN / عربي','AR / English')}</button><button data-action="clear">${t('مسح','Clear')}</button><button data-action="export">${t('تصدير','Export')}</button></div><div class="status">● ${status}</div></header><main id="messages" class="messages">${messages}</main><div class="composer"><textarea id="prompt" rows="1" placeholder="${t('اكتب رسالتك...','Type your message...')}"></textarea><button class="send-btn" data-action="send" ${state.busy?'disabled':''}>${t('إرسال','Send')}</button></div></div>`;bind();$('#messages').scrollTop=$('#messages').scrollHeight}
async function fetchJson(url,options={},timeout=30000){const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(url,{...options,signal:controller.signal,headers:{Accept:'application/json',...(options.headers||{})}});const body=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}: ${body.slice(0,180)}`);try{return JSON.parse(body)}catch{throw new Error(t('استجابة غير صالحة من الخادم','Invalid JSON response from server'))}}finally{clearTimeout(timer)}}
async function askFreeAI(prompt){const history=state.messages.slice(-12).filter(m=>m.content&&!/^جاري التفكير|^Thinking/.test(m.content)).map(m=>({role:m.role,content:m.content}));const system=ar()?'أجب بالعربية مباشرة وباختصار وبدقة، دون مقدمات ترويجية أو تعريف بالنفس.':'Answer directly, concisely and accurately. Do not include promotional introductions or self-description.';let lastError;for(const model of MODELS){try{const data=await fetchJson(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages:[{role:'system',content:system},...history,{role:'user',content:prompt}],temperature:.7,max_tokens:768})});const answer=data?.choices?.[0]?.message?.content||data?.output||data?.response;const text=typeof answer==='string'?answer.trim():'';if(!text)throw new Error(t('الخادم أعاد رداً فارغاً','The server returned an empty response'));state.provider='pollinations';return text}catch(e){lastError=e;console.warn(`Free AI model ${model} failed`,e)}}throw lastError||new Error(t('تعذر الوصول إلى أي محرك مجاني','No free AI provider is available'))}
async function send(){const input=$('#prompt'),prompt=(input?.value||'').trim();if(!prompt||state.busy)return;state.busy=true;state.messages.push({id:uid(),role:'user',content:prompt});state.messages.push({id:uid(),role:'assistant',content:t('جاري التفكير...','Thinking...')});save();render();try{state.messages[state.messages.length-1].content=await askFreeAI(prompt)}catch(e){const detail=e?.name==='AbortError'?t('انتهت مهلة الاتصال. حاول مرة أخرى.','The request timed out. Please try again.'):e?.message||String(e);state.messages[state.messages.length-1].content=t(`تعذّر الاتصال بالخادم المجاني.\n\n${detail}` ,`The free AI server is unavailable.\n\n${detail}`);toast(t('تعذر الاتصال. تمت إعادة المحاولة عبر عدة محركات مجانية.','Connection failed after trying several free models.'))}finally{state.busy=false;save();render();$('#prompt')?.focus()}}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{const a=b.dataset.action;if(a==='language'){state.lang=ar()?'en':'ar';save();render()}else if(a==='clear'){state.messages=[];save();render()}else if(a==='export'){const blob=new Blob([state.messages.map(m=>`${m.role}: ${m.content}`).join('\n\n')||t('لا توجد رسائل.','No messages yet.')],{type:'text/plain;charset=utf-8'});const u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=`editor-chat-${Date.now()}.txt`;x.click();URL.revokeObjectURL(u)}else if(a==='send')await send()});$('#prompt')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}})}
render();
})();
</script></body></html>
