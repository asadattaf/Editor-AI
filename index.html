<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDITOR Lab - local AI chat without API key">
  <title>مختبر EDITOR</title>
  <style>
    :root{color-scheme:dark;--bg:#080d16;--panel:#111c2e;--panel2:#0b1424;--line:#293a55;--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--danger:#ef4444}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.app{height:100%;display:flex;flex-direction:column;background:var(--panel)}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#94a3b8);color:#0f172a;font-size:24px;font-weight:800}.brand{font-weight:800;flex:1}.status{font-size:11px;color:#86efac}.actions{display:flex;gap:7px;align-items:center}.btn{padding:8px 12px;border-radius:9px;background:#16233a;border:1px solid var(--line);font-size:12px}.btn:hover{background:#203454}.primary{background:var(--blue);border-color:#3b82f6}.chat{min-height:0;flex:1;display:flex;flex-direction:column}.messages{min-height:0;flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.welcome{text-align:center;max-width:650px;margin:auto;color:var(--muted)}.welcome h2{color:var(--text)}.msg{max-width:min(850px,92%);padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.65;border:1px solid var(--line)}.msg.user{align-self:flex-end;background:#2563eb;border-top-right-radius:3px}.msg.assistant{align-self:flex-start;background:#1e293b;border-top-left-radius:3px}.msg-head{font-size:11px;font-weight:700;color:#bfdbfe;margin-bottom:5px}.composer{padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line)}textarea{width:100%;resize:none;padding:12px;border-radius:10px;background:#16233a;border:1px solid var(--line);color:#fff;outline:0}textarea:focus{border-color:#3b82f6}.compose{display:flex;gap:8px;margin-top:8px;align-items:center}.grow{flex:1}.toast{position:fixed;z-index:5;top:70px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:9px;background:#020617;border:1px solid #475569;box-shadow:0 8px 30px #0008;font-size:12px}.info{padding:12px 16px;background:#172554;color:#bfdbfe;border-bottom:1px solid #1d4ed8;font-size:12px;line-height:1.6}.small{font-size:11px;color:#cbd5e1}.@media(max-width:700px){header{padding:9px}.status{display:none}.messages{padding:12px}.composer{padding:10px}.actions .btn{padding:7px 8px}.msg{max-width:97%}}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
  const STORE = 'editor-local-ai-v2';
  const WEBLLM_MODEL = 'Llama-3.2-1B-Instruct-q4f16_1-MLC';
  const OLLAMA_URL = 'http://localhost:11434/api/generate';
  const OLLAMA_MODEL = 'llama3.2';
  const $ = (s, r=document) => r.querySelector(s);
  const uid = () => (globalThis.crypto && typeof crypto.randomUUID === 'function') ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`;

  const state = {
    lang: 'ar',
    messages: [],
    busy: false,
    loading: false,
    provider: null,
    engine: null,
    progress: '',
    ollamaReady: false
  };

  try {
    Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}'));
  } catch (_) {}

  if (!Array.isArray(state.messages)) state.messages = [];
  if (!['ar', 'en'].includes(state.lang)) state.lang = 'ar';

  const ar = () => state.lang === 'ar';
  const t = (a, e) => ar() ? a : e;
  const save = () => {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        lang: state.lang,
        messages: state.messages.slice(-40)
      }));
    } catch (_) {}
  };

  const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));

  const toast = (text) => {
    document.querySelector('.toast')?.remove();
    const node = document.createElement('div');
    node.className = 'toast';
    node.textContent = text;
    document.body.appendChild(node);
    setTimeout(() => node.remove(), 3000);
  };

  async function pingOllama() {
    try {
      const res = await fetch(OLLAMA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: OLLAMA_MODEL, prompt: 'ping', stream: false, keep_alive: '30s' })
      });
      if (!res.ok) return false;
      const data = await res.json();
      return !!(data && (data.response || data.content || data.model));
    } catch (_) {
      return false;
    }
  }

  async function ensureWebLLM() {
    if (state.engine) return state.engine;
    if (state.loading) return null;
    if (!('gpu' in navigator)) {
      throw new Error(t('هذا المتصفح لا يدعم WebGPU. استخدم Chrome أو Edge حديثاً.', 'This browser does not support WebGPU. Use a recent Chrome or Edge.'));
    }

    state.loading = true;
    state.progress = t('جاري تحميل محرك الذكاء المحلي...', 'Loading the local AI engine...');
    render();

    try {
      const { CreateMLCEngine } = await import('https://esm.run/@mlc-ai/web-llm');
      state.engine = await CreateMLCEngine(WEBLLM_MODEL, {
        initProgressCallback: (p) => {
          const text = p?.text || `${Math.round((p?.progress || 0) * 100)}%`;
          state.progress = text;
          render();
        }
      });
      state.provider = 'webllm';
      state.progress = t('النموذج المحلي جاهز.', 'Local model ready.');
      return state.engine;
    } catch (error) {
      state.progress = t('فشل بدء WebLLM. سنحاول Ollama إن كان متاحاً.', 'WebLLM failed. Trying Ollama if available.');
      throw error;
    } finally {
      state.loading = false;
      render();
    }
  }

  async function askWebLLM(prompt) {
    const engine = await ensureWebLLM();
    if (!engine) return null;

    const history = state.messages
      .filter(m => m.role === 'user' || m.role === 'assistant')
      .slice(-8)
      .map(m => ({ role: m.role, content: m.content }));

    const system = ar()
      ? 'أنت مساعد عربي مفيد ودقيق. أجب مباشرة وواضحاً. أنت تعمل محلياً داخل المتصفح.'
      : 'You are a helpful and accurate assistant. Answer directly and clearly. You are running locally in the browser.';

    const result = await engine.chat.completions.create({
      messages: [{ role: 'system', content: system }, ...history, { role: 'user', content: prompt }],
      temperature: 0.7,
      max_tokens: 768
    });

    return result?.choices?.[0]?.message?.content?.trim() || null;
  }

  async function askOllama(prompt) {
    try {
      const good = await pingOllama();
      if (!good) return null;

      const reply = await fetch(OLLAMA_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: OLLAMA_MODEL,
          prompt,
          stream: false,
          options: { temperature: 0.7, num_predict: 768 }
        })
      });

      if (!reply.ok) return null;
      const data = await reply.json();
      const answer = data?.response || data?.content || data?.output_text;
      return typeof answer === 'string' && answer.trim() ? answer.trim() : null;
    } catch (_) {
      return null;
    }
  }

  async function ask(prompt) {
    try {
      const fromWebLLM = await askWebLLM(prompt);
      if (fromWebLLM) {
        state.provider = 'webllm';
        return fromWebLLM;
      }
    } catch (_) {
      // Ignore and fall through to Ollama and fallback.
    }

    const fromOllama = await askOllama(prompt);
    if (fromOllama) {
      state.provider = 'ollama';
      state.ollamaReady = true;
      return fromOllama;
    }

    return ar()
      ? 'تم تشغيل الوضع المحلي، لكن لا يوجد محرك AI جاهز في هذا الجهاز. \n\nللتشغيل الحقيقي، ثبت Ollama أو استخدم متصفح يدعم WebGPU ثم اضغط “تشغيل النموذج”.'
      : 'Local mode is active, but no AI engine is ready on this device.\n\nFor real local AI, install Ollama or use a browser with WebGPU and press “Load model”.';
  }

  function render() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = ar() ? 'rtl' : 'ltr';
    document.title = ar() ? 'مختبر EDITOR' : 'EDITOR Lab';

    const messages = state.messages.length
      ? state.messages.map(m => `
        <article class="msg ${m.role}">
          <div class="msg-head">${m.role === 'user' ? t('أنت', 'You') : t('الذكاء المحلي', 'Local AI')}</div>
          <div>${esc(m.content)}</div>
        </article>
      `).join('')
      : `
        <div class="welcome">
          <div class="logo" style="margin:auto">✦</div>
          <h2>${t('ذكاء اصطناعي محلي حقيقي', 'Real local AI')}</h2>
          <p>${t('يدعم هذا الملف WebLLM محلياً. إذا لم يتوفر، نحاول Ollama محلياً أيضاً.', 'This page supports local WebLLM. If unavailable, it also tries local Ollama.')}</p>
        </div>
      `;

    $('#app').innerHTML = `
      <div class="app">
        <header>
          <div class="logo">✦</div>
          <div class="brand">${t('مختبر EDITOR', 'EDITOR Lab')}</div>
          <span class="status">● ${state.provider ? (state.provider === 'webllm' ? t('WebLLM', 'WebLLM') : 'Ollama') : t('محلي', 'Local')}</span>
          <div class="actions">
            <button class="btn primary" data-act="load" ${state.loading ? 'disabled' : ''}>⚡ ${t('تشغيل النموذج', 'Load model')}</button>
            <button class="btn" data-act="lang">${ar() ? 'EN' : 'عربي'}</button>
            <button class="btn" data-act="export">${t('تصدير', 'Export')}</button>
            <button class="btn" data-act="clear">${t('مسح', 'Clear')}</button>
          </div>
        </header>

        <div class="info">
          <div>${state.progress || t('جاهز للتشغيل المحلي بدون مفتاح خارجي.', 'Ready for local use without external API key.')}</div>
          <div class="small">${t('ملاحظة: أول تشغيل قد يستغرق وقتاً لتنزيل النموذج.', 'Note: first launch may take time to download the model.')}</div>
        </div>

        <main class="chat">
          <div id="messages" class="messages">${messages}</div>
          <div class="composer">
            <textarea id="prompt" rows="2" placeholder="${t('اكتب رسالتك...', 'Type your message...')}" ${state.busy ? 'disabled' : ''}></textarea>
            <div class="compose">
              <span class="grow"></span>
              <button class="btn primary" data-act="send" ${state.busy ? 'disabled' : ''}>➤ ${state.busy ? t('جاري التفكير...', 'Thinking...') : t('إرسال', 'Send')}</button>
            </div>
          </div>
        </main>
      </div>
    `;

    bind();
    const box = $('#messages');
    if (box) box.scrollTop = box.scrollHeight;
  }

  async function send() {
    const input = $('#prompt');
    const prompt = input?.value.trim();
    if (!prompt || state.busy) return;

    state.busy = true;
    state.messages.push({ id: uid(), role: 'user', content: prompt });
    state.messages.push({ id: uid(), role: 'assistant', content: t('جاري التفكير...', 'Thinking...') });
    render();

    try {
      const answer = await ask(prompt);
      state.messages[state.messages.length - 1].content = answer;
    } catch (error) {
      state.messages[state.messages.length - 1].content = ar()
        ? 'تعذر تشغيل النموذج المحلي.'
        : 'The local model could not be started.';
      toast(ar() ? 'تأكد من دعم WebGPU أو أن Ollama يعمل على localhost:11434.' : 'Check WebGPU support or that Ollama is running on localhost:11434.');
    } finally {
      state.busy = false;
      save();
      render();
    }
  }

  function bind() {
    document.querySelectorAll('[data-act]').forEach(button => {
      button.addEventListener('click', async () => {
        const action = button.dataset.act;

        if (action === 'lang') {
          state.lang = ar() ? 'en' : 'ar';
          save();
          render();
          return;
        }

        if (action === 'clear') {
          state.messages = [];
          save();
          render();
          return;
        }

        if (action === 'load') {
          try {
            await ensureWebLLM();
            toast(t('تم تشغيل محرك WebLLM محلياً.', 'Local WebLLM engine is ready.'));
          } catch (error) {
            if (await pingOllama()) {
              state.provider = 'ollama';
              state.ollamaReady = true;
              toast(t('تم اكتشاف Ollama محلياً.', 'Local Ollama was detected.'));
            } else {
              toast(error?.message || String(error));
            }
          }
          render();
          return;
        }

        if (action === 'send') {
          send();
          return;
        }

        if (action === 'export') {
          const text = state.messages.map(m => `${m.role}: ${m.content}`).join('\n\n');
          const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'editor-local-chat.txt';
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 500);
        }
      });
    });

    $('#prompt')?.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        send();
      }
    });
  }

  render();
</script>
</body>
</html>
