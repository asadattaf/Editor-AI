<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDITOR Lab - private local AI chat">
  <title>مختبر EDITOR</title>
  <style>
    :root{color-scheme:dark;--bg:#080d16;--panel:#111c2e;--panel2:#0b1424;--line:#293a55;--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--danger:#ef4444}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}button:disabled{opacity:.5;cursor:not-allowed}.app{height:100%;display:flex;flex-direction:column;background:var(--panel)}header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--panel2);border-bottom:1px solid var(--line)}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#94a3b8);color:#0f172a;font-size:24px;font-weight:800}.brand{font-weight:800;flex:1}.status{font-size:11px;color:#fbbf24}.actions{display:flex;gap:7px;align-items:center}.btn{padding:8px 12px;border-radius:9px;background:#16233a;border:1px solid var(--line);font-size:12px}.btn:hover{background:#203454}.primary{background:var(--blue);border-color:#3b82f6}.chat{min-height:0;flex:1;display:flex;flex-direction:column}.messages{min-height:0;flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}.welcome{text-align:center;max-width:650px;margin:auto;color:var(--muted)}.welcome h2{color:var(--text)}.msg{max-width:min(850px,92%);padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word;line-height:1.65;border:1px solid var(--line)}.msg.user{align-self:flex-end;background:#2563eb;border-top-right-radius:3px}.msg.assistant{align-self:flex-start;background:#1e293b;border-top-left-radius:3px}.msg-head{font-size:11px;font-weight:700;color:#bfdbfe;margin-bottom:5px}.composer{padding:12px 16px;background:var(--panel2);border-top:1px solid var(--line)}textarea{width:100%;resize:none;padding:12px;border-radius:10px;background:#16233a;border:1px solid var(--line);color:#fff;outline:0}textarea:focus{border-color:#3b82f6}.compose{display:flex;gap:8px;margin-top:8px;align-items:center}.grow{flex:1}.progress{font-size:11px;color:var(--muted);margin-top:7px;min-height:16px}.toast{position:fixed;z-index:5;top:70px;left:50%;transform:translateX(-50%);padding:10px 14px;border-radius:9px;background:#020617;border:1px solid #475569;box-shadow:0 8px 30px #0008;font-size:12px}.info{padding:10px 16px;background:#172554;color:#bfdbfe;border-bottom:1px solid #1d4ed8;font-size:12px;line-height:1.6}@media(max-width:700px){header{padding:9px}.status{display:none}.messages{padding:12px}.composer{padding:10px}.actions .btn{padding:7px 8px}.msg{max-width:97%}}
  </style>
</head>
<body>
<div id="app"></div>
<script type="module">
  const MODEL = 'Llama-3.2-1B-Instruct-q4f16_1-MLC';
  const STORE = 'editor-local-webllm-v1';
  const $ = (s, r=document) => r.querySelector(s);
  const uid = () => crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`;
  const state = { lang:'ar', messages:[], busy:false, engine:null, loading:false, progress:'', webgpu:false };
  try { Object.assign(state, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch {}
  if (!Array.isArray(state.messages)) state.messages=[];
  const ar = () => state.lang === 'ar';
  const t = (a,e) => ar() ? a : e;
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify({lang:state.lang,messages:state.messages.slice(-40)})); } catch {} };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const toast = text => { document.querySelector('.toast')?.remove(); const n=document.createElement('div'); n.className='toast'; n.textContent=text; document.body.append(n); setTimeout(()=>n.remove(),3000); };

  async function loadEngine() {
    if (state.engine || state.loading) return state.engine;
    if (!('gpu' in navigator)) throw new Error(t('هذا المتصفح لا يدعم WebGPU. استخدم Chrome أو Edge حديثاً.', 'WebGPU is not supported. Use a recent Chrome or Edge browser.'));
    state.loading=true; state.progress=t('جاري تحميل محرك الذكاء الاصطناعي...', 'Loading the local AI engine...'); render();
    try {
      const {CreateMLCEngine} = await import('https://esm.run/@mlc-ai/web-llm');
      state.engine = await CreateMLCEngine(MODEL, {
        initProgressCallback: p => { state.progress = p?.text || `${Math.round((p?.progress || 0)*100)}%`; render(); }
      });
      state.webgpu=true; state.progress=t('النموذج المحلي جاهز.', 'Local model ready.');
      return state.engine;
    } catch (e) {
      state.progress=''; throw e;
    } finally { state.loading=false; render(); }
  }

  async function ask(prompt) {
    const engine = await loadEngine();
    const history = state.messages.filter(m=>m.role==='user'||m.role==='assistant').slice(-12).map(m=>({role:m.role,content:m.content}));
    const system = ar() ? 'أنت مساعد عربي مفيد ودقيق. أجب مباشرة وبوضوح، واذكر أنك تعمل محلياً عند الحاجة.' : 'You are a helpful, accurate assistant. Answer directly and clearly. You run locally in the browser.';
    const result = await engine.chat.completions.create({
      messages:[{role:'system',content:system},...history,{role:'user',content:prompt}],
      temperature:0.7, max_tokens:768
    });
    return result.choices?.[0]?.message?.content?.trim() || t('لم ينتج النموذج رداً.', 'The model returned no response.');
  }

  function render() {
    document.documentElement.lang=state.lang; document.documentElement.dir=ar()?'rtl':'ltr'; document.title=ar()?'مختبر EDITOR':'EDITOR Lab';
    const messages = state.messages.length ? state.messages.map(m=>`<article class="msg ${m.role}"><div class="msg-head">${m.role==='user'?t('أنت','You'):t('الذكاء الاصطناعي المحلي','Local AI')}</div><div>${esc(m.content)}</div></article>`).join('') : `<div class="welcome"><div class="logo" style="margin:auto">✦</div><h2>${t('ذكاء اصطناعي محلي حقيقي','Real Local AI')}</h2><p>${t('يعمل النموذج داخل متصفحك باستخدام WebGPU بدون GEMINI_API_KEY. أول تشغيل يحتاج تنزيل النموذج.', 'The model runs inside your browser with WebGPU without GEMINI_API_KEY. The first run downloads the model.')}</p></div>`;
    $('#app').innerHTML=`<div class="app"><header><div class="logo">✦</div><div class="brand">${t('مختبر EDITOR','EDITOR Lab')}</div><span class="status">● ${state.engine?t('النموذج جاهز','Model ready'):t('محلي بدون مفتاح','Local · no key')}</span><div class="actions"><button class="btn" data-act="load" ${state.loading?'disabled':''}>⚡ ${t('تشغيل النموذج','Load model')}</button><button class="btn" data-act="lang">${ar()?'EN':'عربي'}</button><button class="btn" data-act="export">${t('تصدير','Export')}</button><button class="btn" data-act="clear">${t('مسح','Clear')}</button></div></header><div class="info">${state.progress || t('النموذج: '+MODEL+' — ذكاء اصطناعي حقيقي محلي، وليس ردوداً ثابتة.', 'Model: '+MODEL+' — real local AI, not canned replies.')}</div><main class="chat"><div id="messages" class="messages">${messages}</div><div class="composer"><textarea id="prompt" rows="2" placeholder="${t('اكتب رسالتك...','Type your message...')}" ${state.busy?'disabled':''}></textarea><div class="compose"><span class="grow"></span><button class="btn primary" data-act="send" ${state.busy?'disabled':''}>➤ ${state.busy?t('جاري التفكير...','Thinking...'):t('إرسال','Send')}</button></div></div></main></div>`;
    bind(); const box=$('#messages'); if(box) box.scrollTop=box.scrollHeight;
  }

  async function send() {
    const input=$('#prompt'); const prompt=input?.value.trim(); if(!prompt||state.busy)return;
    state.busy=true; state.messages.push({id:uid(),role:'user',content:prompt}); state.messages.push({id:uid(),role:'assistant',content:t('جاري التفكير...','Thinking...')}); render();
    try { state.messages[state.messages.length-1].content=await ask(prompt); }
    catch(e) { state.messages[state.messages.length-1].content=t('تعذر تشغيل النموذج المحلي: '+(e.message||e), 'Could not start the local model: '+(e.message||e)); toast(t('تحقق من دعم WebGPU واتصال الإنترنت لتنزيل النموذج.', 'Check WebGPU support and internet access to download the model.')); }
    state.busy=false; save(); render();
  }
  function bind() {
    document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click', async()=>{
      const a=b.dataset.act;
      if(a==='lang'){state.lang=ar()?'en':'ar';save();render();}
      else if(a==='clear'){state.messages=[];save();render();}
      else if(a==='load'){try{await loadEngine();}catch(e){toast(e.message||String(e));}}
      else if(a==='send')send();
      else if(a==='export'){const text=state.messages.map(m=>`${m.role}: ${m.content}`).join('\n\n'); const u=URL.createObjectURL(new Blob([text],{type:'text/plain'})); const link=document.createElement('a');link.href=u;link.download='editor-local-chat.txt';link.click();setTimeout(()=>URL.revokeObjectURL(u),500);}
    }));
    $('#prompt')?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
  }
  render();
</script>
</body>
</html>
