<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A simple to-do list application with local storage persistence." />
  <title>To-Do List</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --danger: #dc2626;
      --shadow: 0 18px 45px rgba(30, 41, 59, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(135deg, #eef2ff, var(--bg));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app { width: min(100%, 720px); }
    .card {
      background: var(--card);
      border: 1px solid rgba(229, 231, 235, .9);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    header { padding: 30px 30px 22px; border-bottom: 1px solid var(--border); }
    h1 { margin: 0 0 6px; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.04em; }
    .subtitle { margin: 0; color: var(--muted); }

    .content { padding: 22px 30px 30px; }
    .add-form { display: flex; gap: 10px; margin-bottom: 18px; }
    input, button { font: inherit; }
    input[type="text"] {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      color: var(--text);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .14);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 11px 16px;
      cursor: pointer;
      transition: background .2s, transform .15s, opacity .2s;
    }
    button:active { transform: translateY(1px); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .primary { background: var(--primary); color: white; font-weight: 700; }
    .primary:hover { background: var(--primary-dark); }

    .toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .filters { display: flex; gap: 6px; }
    .filter {
      padding: 7px 11px;
      background: transparent;
      color: var(--muted);
      font-size: .9rem;
    }
    .filter:hover, .filter.active { background: #eef2ff; color: var(--primary-dark); font-weight: 700; }
    .clear { padding: 7px 0; background: transparent; color: var(--danger); font-size: .9rem; }
    .clear:hover { opacity: .75; }

    .todo-list { display: grid; gap: 9px; min-height: 80px; }
    .todo {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: #fff;
      animation: appear .18s ease-out;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .todo input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
    .todo-text { flex: 1; overflow-wrap: anywhere; }
    .todo.completed .todo-text { color: var(--muted); text-decoration: line-through; }
    .delete {
      padding: 6px 8px;
      background: transparent;
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1;
    }
    .delete:hover { color: var(--danger); background: #fef2f2; }
    .empty { padding: 26px 12px; text-align: center; color: var(--muted); }
    .stats { margin-top: 18px; color: var(--muted); font-size: .9rem; text-align: center; }
    .storage-note { margin: 14px 0 0; color: var(--muted); font-size: .78rem; text-align: center; }

    @media (max-width: 560px) {
      body { padding: 12px; }
      header, .content { padding-left: 18px; padding-right: 18px; }
      .add-form { flex-direction: column; }
      .add-form .primary { width: 100%; }
      .toolbar { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="page-title">
      <header>
        <h1 id="page-title">My To-Do List</h1>
        <p class="subtitle">Keep track of what needs to get done.</p>
      </header>

      <div class="content">
        <form class="add-form" id="todo-form">
          <input id="todo-input" type="text" maxlength="200" placeholder="What needs to be done?" autocomplete="off" aria-label="New task" />
          <button class="primary" type="submit">Add task</button>
        </form>

        <div class="toolbar">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter active" type="button" data-filter="all">All</button>
            <button class="filter" type="button" data-filter="active">Active</button>
            <button class="filter" type="button" data-filter="completed">Completed</button>
          </div>
          <button class="clear" id="clear-completed" type="button">Clear completed</button>
        </div>

        <div class="todo-list" id="todo-list" aria-live="polite"></div>
        <div class="stats" id="stats"></div>
        <p class="storage-note">Your tasks are saved automatically in this browser.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'editor-todo-list-v1';
      let todos = loadTodos();
      let filter = 'all';

      const form = document.getElementById('todo-form');
      const input = document.getElementById('todo-input');
      const list = document.getElementById('todo-list');
      const stats = document.getElementById('stats');
      const clearCompleted = document.getElementById('clear-completed');
      const filterButtons = [...document.querySelectorAll('[data-filter]')];

      function loadTodos() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(saved) ? saved.filter(item => item && typeof item.text === 'string') : [];
        } catch {
          return [];
        }
      }

      function saveTodos() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      }

      function createId() {
        return crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
      }

      function visibleTodos() {
        if (filter === 'active') return todos.filter(todo => !todo.completed);
        if (filter === 'completed') return todos.filter(todo => todo.completed);
        return todos;
      }

      function render() {
        list.replaceChildren();
        const visible = visibleTodos();

        if (!visible.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = todos.length ? 'No tasks in this view.' : 'No tasks yet. Add one above!';
          list.appendChild(empty);
        } else {
          visible.forEach(todo => {
            const item = document.createElement('div');
            item.className = `todo${todo.completed ? ' completed' : ''}`;

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.checked = todo.completed;
            checkbox.setAttribute('aria-label', `Mark “${todo.text}” as ${todo.completed ? 'active' : 'completed'}`);
            checkbox.addEventListener('change', () => toggleTodo(todo.id));

            const text = document.createElement('span');
            text.className = 'todo-text';
            text.textContent = todo.text;

            const deleteButton = document.createElement('button');
            deleteButton.className = 'delete';
            deleteButton.type = 'button';
            deleteButton.textContent = '×';
            deleteButton.setAttribute('aria-label', `Delete “${todo.text}”`);
            deleteButton.addEventListener('click', () => deleteTodo(todo.id));

            item.append(checkbox, text, deleteButton);
            list.appendChild(item);
          });
        }

        const remaining = todos.filter(todo => !todo.completed).length;
        stats.textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} remaining · ${todos.length} total`;
        clearCompleted.disabled = !todos.some(todo => todo.completed);
        filterButtons.forEach(button => button.classList.toggle('active', button.dataset.filter === filter));
      }

      function addTodo(text) {
        todos.unshift({ id: createId(), text, completed: false, createdAt: Date.now() });
        saveTodos();
        render();
      }

      function toggleTodo(id) {
        todos = todos.map(todo => todo.id === id ? { ...todo, completed: !todo.completed } : todo);
        saveTodos();
        render();
      }

      function deleteTodo(id) {
        todos = todos.filter(todo => todo.id !== id);
        saveTodos();
        render();
      }

      form.addEventListener('submit', event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addTodo(text);
        input.value = '';
        input.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener('click', () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearCompleted.addEventListener('click', () => {
        todos = todos.filter(todo => !todo.completed);
        saveTodos();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
