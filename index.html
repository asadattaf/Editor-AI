<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="EDITOR Lab - AI chat, code studio and Android project generator" />
  <title>مختبر EDITOR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#080d16;--panel:#111c2e;--panel2:#0b1424;--panel3:#16233a;--line:#293a55;--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--danger:#ef4444}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{height:100%;display:flex;flex-direction:column;background:var(--panel)}.topbar,.footer{background:var(--panel2);border-color:var(--line);border-style:solid}.topbar{border-width:0 0 1px;padding:10px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;min-width:0}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#fff,#94a3b8 60%,#475569);color:#08101d;font-weight:900;box-shadow:0 4px 12px #0008}.brand h1{font-size:16px;margin:0}.brand small{color:var(--muted);font-size:11px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.metal{padding:8px 11px;border-radius:10px;background:linear-gradient(145deg,#fff,#cbd5e1 48%,#64748b);color:#0f172a;font-weight:800;box-shadow:0 3px 7px #0008;white-space:nowrap}.metal:hover{filter:brightness(1.12);transform:translateY(-1px)}.main{flex:1;min-height:0;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}.welcome{max-width:700px;margin:auto;text-align:center;color:var(--muted)}.welcome h2{color:#fff;font-size:24px}.quick{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:18px}.quick button,.suggestions button{background:var(--panel3);border:1px solid var(--line);color:#dbeafe;padding:11px;border-radius:10px;text-align:right}.quick button:hover,.suggestions button:hover{border-color:#60a5fa;background:#1d3152}.msg{max-width:min(850px,90%);padding:12px 14px;border-radius:15px;background:#1e293b;border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.65}.msg.user{align-self:flex-end;background:#2563eb;border-color:#60a5fa}.msg.assistant{align-self:flex-start}.files{font-size:11px;color:#bae6fd;border-bottom:1px solid #ffffff22;padding-bottom:6px;margin-bottom:7px}.actions{display:flex;gap:10px;border-top:1px solid #ffffff18;padding-top:7px;margin-top:8px}.actions button{background:none;color:#cbd5e1;font-size:11px}.actions button:hover{color:#fff}.composer{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--panel2)}.composer input{flex:1;min-width:0;background:var(--panel3);border:1px solid var(--line);border-radius:11px;padding:11px;color:#fff;outline:none}.composer input:focus{border-color:#60a5fa}.footer{border-width:1px 0 0;padding:7px 14px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between}.tray{padding:8px 14px;border-top:1px solid var(--line);background:#0f1a2c;color:#cbd5e1;font-size:12px;max-height:90px;overflow:auto}.file-chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel3);border:1px solid var(--line);border-radius:8px;padding:5px 8px;margin:3px}.file-chip button{background:none;color:#fca5a5}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(5px);z-index:10;display:grid;place-items:center;padding:12px}.dialog{width:min(1000px,100%);height:min(90vh,800px);background:var(--panel);border:1px solid #3b5277;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px #000}.dialog-head,.dialog-foot{padding:12px 16px;background:var(--panel2);border-color:var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.dialog-head{border-bottom:1px solid var(--line)}.dialog-foot{border-top:1px solid var(--line);flex-wrap:wrap}.dialog h2{font-size:16px;margin:0}.close{background:#263957;color:#fff;border-radius:8px;padding:7px 10px}.dialog-body{padding:14px;overflow:auto;display:flex;flex-direction:column;gap:10px;flex:1}.field{display:flex;flex-direction:column;gap:5px;color:#cbd5e1;font-size:12px}.field input,.field textarea,.code{background:#080e1a;border:1px solid var(--line);border-radius:9px;color:#dbeafe;padding:9px;outline:none}.field textarea{min-height:70px;resize:vertical}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tab{background:var(--panel3);color:#cbd5e1;padding:8px 10px;border-radius:8px}.tab.active{background:#60a5fa;color:#08101d;font-weight:800}.code{width:100%;min-height:300px;flex:1;font-family:ui-monospace,monospace;resize:none;white-space:pre;direction:ltr;text-align:left}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;z-index:20;top:18px;left:50%;transform:translateX(-50%);background:#17243a;border:1px solid #60a5fa;border-radius:10px;padding:10px 14px;box-shadow:0 8px 25px #000;color:#fff;font-size:12px}@media(max-width:700px){.toolbar .label{display:none}.topbar{align-items:flex-start}.quick{grid-template-columns:1fr}.msg{max-width:96%}.dialog{height:95vh}.two{grid-template-columns:1fr}.composer{padding:8px}.metal{padding:8px}.brand small{display:none}}
  </style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
  'use strict';
  const $ = (s, root=document) => root.querySelector(s);
  const uid = () => globalThis.crypto?.randomUUID?.() || Date.now()+'-'+Math.random().toString(36).slice(2);
  const store = 'editor-lab-v3';
  const templates = {
    javascript:`export async function fetchInteraction(prompt) {\n  const response = await fetch('/api/chat', {\n    method: 'POST',\n    headers: {'Content-Type': 'application/json'},\n    body: JSON.stringify({messages: [{role: 'user', content: prompt}], language: 'en'})\n  });\n  if (!response.ok) throw new Error('Request failed');\n  return response.json();\n}`,
    typescript:`export type Result<T> = { ok: true; data: T } | { ok: false; error: string };\n\nexport function isSuccess<T>(result: Result<T>): result is {ok:true;data:T} {\n  return result.ok;\n}`,
    python:`from typing import Any\n\ndef process_data(data: list[Any]) -> dict[str, Any]:\n    return {"count": len(data), "status": "success"}\n\nif __name__ == "__main__":\n    print(process_data([]))`,
    kotlin:`package com.editor.app\n\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\n\nclass MainActivity : AppCompatActivity() {\n  override fun onCreate(savedInstanceState: Bundle?) {\n    super.onCreate(savedInstanceState)\n    setContentView(R.layout.activity_main)\n  }\n}`,
    html:`<!doctype html>\n<html lang="ar" dir="rtl">\n<head><meta charset="utf-8"><title>EDITOR App</title></head>\n<body><main><h1>مرحباً بك</h1></main></body>\n</html>`,
    sql:`CREATE TABLE IF NOT EXISTS interactions (\n  id VARCHAR(64) PRIMARY KEY,\n  user_prompt TEXT NOT NULL,\n  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);`
  };
  const languages=[['javascript','JavaScript','.js'],['typescript','TypeScript','.ts'],['python','Python','.py'],['kotlin','Kotlin (Android)','.kt'],['html','HTML5','.html'],['sql','SQL','.sql']];
  const state={language:'ar',messages:[],files:[],busy:false,modal:null,codeLang:'javascript',code:templates.javascript,codePrompt:'',apk:{name:'EDITORAssistant',pkg:'com.editor.assistant.app',type:'Kotlin',desc:'تطبيق ذكي للمحادثة مع الذكاء الاصطناعي'}};
  try{const saved=JSON.parse(localStorage.getItem(store)||'{}');Object.assign(state,saved);if(!Array.isArray(state.messages))state.messages=[];if(!Array.isArray(state.files))state.files=[];}catch{}
  const ar=()=>state.language==='ar', t=(a,e)=>ar()?a:e;
  const save=()=>{try{localStorage.setItem(store,JSON.stringify({language:state.language,messages:state.messages.slice(-50)}));}catch{}};
  const toast=text=>{document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=text;document.body.append(e);setTimeout(()=>e.remove(),2600)};
  const download=(name,data,type='text/plain;charset=utf-8')=>{const a=document.createElement('a');const u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function render(){document.documentElement.lang=state.language;document.documentElement.dir=ar()?'rtl':'ltr';document.title=ar()?'مختبر EDITOR':'EDITOR Lab';$('#app').innerHTML=`<div class="app"><header class="topbar"><div class="brand"><div class="logo">E</div><div><h1>${t('مختبر EDITOR','EDITOR Lab')}</h1><small>${t('محادثة وكتابة أكواد وبناء مشاريع أندرويد','AI chat, code studio and Android project builder')}</small></div></div><nav class="toolbar"><button class="metal" data-action="code">⌘ <span class="label">${t('استوديو الأكواد','Code Studio')}</span></button><button class="metal" data-action="apk">📱 <span class="label">${t('بناء APK','APK Studio')}</span></button><button class="metal" data-action="lang">${ar()?'EN':'AR'}</button><button class="metal" data-action="clear">🗑</button></nav></header><main class="main"><section class="messages" id="messages">${renderMessages()}</section>${state.files.length?renderFiles():''}<div class="composer"><input id="prompt" placeholder="${t('اكتب رسالتك أو ارفع ملفات...','Type a message or attach files...')}" ${state.busy?'disabled':''}/><input id="picker" type="file" multiple hidden><button class="metal" data-action="attach">＋</button><button class="metal" data-action="send" ${state.busy?'disabled':''}>${state.busy?'⟳':'➤'}</button></div></main><footer class="footer"><span>${state.busy?t('جاري المعالجة...','Processing...'):t('جاهز - تشغيل مستقل مع دعم API','Ready - standalone with API support')}</span><span>${state.files.length}/100 ${t('ملف','files')}</span></footer>${state.modal?renderModal():''}</div>`;bind();scrollBottom();}
  function renderMessages(){if(!state.messages.length)return `<div class="welcome"><div class="logo" style="margin:auto">✦</div><h2>${t('مرحباً بك في مختبر EDITOR','Welcome to EDITOR Lab')}</h2><p>${t('أرسل سؤالاً، صمّم كوداً، أو أنشئ مشروع Android قابلاً للبناء.','Ask a question, design code, or create a buildable Android project.')}</p><div class="quick"><button data-quick="${escape(t('اكتب دالة JavaScript كاملة مع اختبارات.','Write a complete JavaScript function with tests.'))}">⚡ ${t('تصميم كود','Code design')}</button><button data-quick="${escape(t('كيف أبني تطبيق Android APK باستخدام Gradle؟','How do I build an Android APK with Gradle?'))}">📱 ${t('هندسة APK','APK architecture')}</button></div></div>`;return state.messages.map((m,i)=>`<article class="msg ${m.role}">${m.files?.length?`<div class="files">📎 ${m.files.map(f=>escape(f.name)).join('، ')}</div>`:''}${escape(m.content)}<div class="actions"><button data-copy="${i}">📋 ${t('نسخ','Copy')}</button><button data-download="${i}">⬇ ${t('تنزيل','Download')}</button></div></article>`).join('');}
  function renderFiles(){return `<div class="tray"><b>${t('الملفات المختارة','Selected files')} (${state.files.length}/100):</b>${state.files.map((f,i)=>`<span class="file-chip">${escape(f.name)} <small>${format(f.size)}</small><button data-remove="${i}">×</button></span>`).join('')}</div>`}
  function renderModal(){return state.modal==='code'?codeModal():apkModal()}
  function codeModal(){return `<div class="modal"><section class="dialog"><header class="dialog-head"><h2>💻 ${t('استوديو الأكواد','Code Studio')}</h2><button class="close" data-action="close">×</button></header><div class="dialog-body"><div class="tabs">${languages.map(l=>`<button class="tab ${state.codeLang===l[0]?'active':''}" data-lang="${l[0]}">${l[1]}</button>`).join('')}</div><div class="field"><label>${t('وصف المطلوب','Requirements')}</label><input id="codePrompt" value="${escape(state.codePrompt)}" placeholder="${t('مثال: API لتسجيل المستخدمين','Example: user registration API')}"/></div><textarea id="code" class="code">${escape(state.code)}</textarea></div><footer class="dialog-foot"><button class="metal" data-action="generate-code">✨ ${t('توليد','Generate')}</button><button class="metal" data-action="copy-code">📋 ${t('نسخ','Copy')}</button><button class="metal" data-action="download-code">⬇ ${t('تنزيل','Download')}</button><button class="metal" data-action="share-code">➤ ${t('مشاركة','Share')}</button></footer></section></div>`}
  function apkModal(){const a=state.apk;const manifest=`<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${a.pkg}">\n <uses-permission android:name="android.permission.INTERNET" />\n <application android:theme="@style/Theme.AppCompat" android:label="${a.name}">\n  <activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>\n </application>\n</manifest>`;const main=`package ${a.pkg}\n\nimport android.os.Bundle\nimport androidx.appcompat.app.AppCompatActivity\n\nclass MainActivity : AppCompatActivity() {\n override fun onCreate(savedInstanceState: Bundle?) {\n  super.onCreate(savedInstanceState)\n  setContentView(R.layout.activity_main)\n }\n}`;const gradle=`plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }\n\nandroid { namespace '${a.pkg}'; compileSdk 35\n defaultConfig { applicationId '${a.pkg}'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }\n}\n\ndependencies { implementation 'androidx.core:core-ktx:1.15.0'; implementation 'androidx.appcompat:appcompat:1.7.0' }`;return `<div class="modal"><section class="dialog"><header class="dialog-head"><h2>📱 ${t('استوديو Android APK','Android APK Studio')}</h2><button class="close" data-action="close">×</button></header><div class="dialog-body"><div class="two"><div class="field"><label>${t('اسم التطبيق','App name')}</label><input id="apkName" value="${escape(a.name)}"/></div><div class="field"><label>${t('معرف الحزمة','Package')}</label><input id="apkPkg" value="${escape(a.pkg)}"/></div></div><div class="field"><label>${t('الوصف','Description')}</label><textarea id="apkDesc">${escape(a.desc)}</textarea></div><div class="tabs"><button class="tab active">MainActivity.kt</button><button class="tab">AndroidManifest.xml</button><button class="tab">build.gradle</button></div><textarea class="code" id="apkCode">${escape(main)}\n\n--- MANIFEST ---\n${escape(manifest)}\n\n--- GRADLE ---\n${escape(gradle)}</textarea></div><footer class="dialog-foot"><button class="metal" data-action="download-apk">🗜 ${t('تنزيل مشروع ZIP','Download ZIP project')}</button><button class="metal" data-action="share-apk">➤ ${t('مشاركة في المحادثة','Share in chat')}</button></footer></section></div>`}
  function format(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
  function scrollBottom(){const m=$('#messages');if(m)m.scrollTop=m.scrollHeight}
  function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>send(b.dataset.quick));document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.codeLang=b.dataset.lang;state.code=templates[state.codeLang]||'';render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.files.splice(+b.dataset.remove,1);render()});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(state.messages[+b.dataset.copy]?.content||''));document.querySelectorAll('[data-download]').forEach(b=>download('editor-message.txt',state.messages[+b.dataset.download]?.content||''));$('#prompt')?.addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('#picker')?.addEventListener('change',e=>{for(const f of e.target.files){if(state.files.length<100)state.files.push({name:f.name,size:f.size,text:f.type.startsWith('text/')?null:null})}render()});}
  async function action(a){if(a==='lang'){state.language=ar()?'en':'ar';save();render();return}if(a==='clear'){state.messages=[];state.files=[];save();render();return}if(a==='attach'){$('#picker')?.click();return}if(a==='close'){state.modal=null;render();return}if(a==='code'){state.modal='code';render();return}if(a==='apk'){state.modal='apk';render();return}if(a==='copy-code'){copy($('#code')?.value||state.code);return}if(a==='download-code'){download('editor-code.'+languages.find(x=>x[0]===state.codeLang)[2],$('#code')?.value||state.code);return}if(a==='generate-code'){state.codePrompt=$('#codePrompt')?.value||'';try{const r=await fetch('/api/generate-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:state.codeLang,description:state.codePrompt})});const d=await r.json();if(d.code)state.code=d.code;}catch{state.code=(templates[state.codeLang]||'')+'\n\n// '+state.codePrompt}render();return}if(a==='share-code'){send('💻 '+state.code);state.modal=null;render();return}if(a==='download-apk'){const name=$('#apkName')?.value||state.apk.name,pkg=$('#apkPkg')?.value||state.apk.pkg;const z=new JSZip();z.file('app/src/main/AndroidManifest.xml',`<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="${pkg}"><uses-permission android:name="android.permission.INTERNET"/><application android:theme="@style/Theme.AppCompat" android:label="${name}"><activity android:name=".MainActivity" android:exported="true"/></application></manifest>`);z.file('app/src/main/java/'+pkg.replace(/\./g,'/')+'/MainActivity.kt',`package ${pkg}\n\nimport android.app.Activity\nclass MainActivity : Activity()`);z.file('settings.gradle',"pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\nrootProject.name='"+name+"'\ninclude ':app'");const blob=await z.generateAsync({type:'blob'});const u=URL.createObjectURL(blob),el=document.createElement('a');el.href=u;el.download=name+'_android_project.zip';el.click();setTimeout(()=>URL.revokeObjectURL(u),500);toast(t('تم تنزيل المشروع','Project downloaded'));return}if(a==='share-apk'){send('📱 '+t('مشروع Android APK','Android APK project')+' '+($('#apkName')?.value||state.apk.name));state.modal=null;render();}}
  async function copy(text){try{await navigator.clipboard.writeText(text);toast(t('تم النسخ','Copied'))}catch{toast(t('تعذر النسخ','Copy unavailable'))}}
  async function send(value){const input=$('#prompt');const text=(value??input?.value??'').trim();if((!text&&!state.files.length)||state.busy)return;const files=state.files.splice(0);state.messages.push({id:uid(),role:'user',content:text||t('ملفات مرفقة','Attached files'),files});state.busy=true;save();render();let answer='';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:state.messages.map(m=>({role:m.role,content:m.content})),language:state.language,attachedFiles:files})});if(!r.ok)throw Error();const d=await r.json();answer=d.choices?.[0]?.message?.content||d.response||'';}catch{answer=ar()?'تمت معالجة طلبك محلياً. أضف GEMINI_API_KEY لتفعيل الاستجابة الذكية من الخادم.':'Request processed locally. Add GEMINI_API_KEY to enable server AI responses.'}state.messages.push({id:uid(),role:'assistant',content:answer});state.busy=false;save();render()}
  render();
})();
</script>
</body>
</html>
