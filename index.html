<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EDITOR Lab - direct free AI assistant" />
    <title>مختبر EDITOR</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #08101d;
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }
      .fallback {
        max-width: 700px;
        width: calc(100% - 32px);
        background: #0f172a;
        border: 1px solid #243650;
        border-radius: 18px;
        padding: 28px 24px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.35);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }
      p, li {
        color: #cbd5e1;
        line-height: 1.7;
        font-size: 15px;
      }
      code, pre {
        background: rgba(148, 163, 184, 0.12);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 10px 12px;
        display: block;
        white-space: pre-wrap;
        color: #e2e8f0;
      }
      a {
        display: inline-block;
        margin-top: 14px;
        color: #7dd3fc;
        text-decoration: none;
        font-weight: 700;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      if (location.protocol === 'file:') {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="fallback">
            <h1>تعذر تشغيل التطبيق مباشرة</h1>
            <p>هذا المشروع ليس تطبيق HTML بسيط، بل تطبيق React + Vite يحتاج خادم محلي ليعمل بشكل صحيح.</p>
            <p>الخطوات الصحيحة:</p>
            <pre>npm install
npm run dev</pre>
            <p>ثم افتح:</p>
            <pre>http://localhost:3000</pre>
            <a href="http://localhost:3000" target="_blank" rel="noreferrer">فتح الموقع المحلي</a>
          </div>
        `;
      } else {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.tsx';
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
