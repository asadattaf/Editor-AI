<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="EDITOR Lab - free AI chat">
  <title>مختبر EDITOR</title>
  <style>
    :root{color-scheme:dark;--bg:#080d16;--panel:#111c2e;--panel2:#0b1424;--line:#293a55;--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--green:#10b981;--danger:#ef4444}
    *{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:auto;background:var(--panel)}header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--panel2);border-bottom:1px solid var(--line)}.logo{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(145deg,#fff,#94a3b8);color:#0f172a;font-size:22px;font-weight:800}.brand{font-weight:800;font-size:16px;flex:1}.status{color:var(--green);font-size:12px}.toolbar{display:flex;gap:8px}button{border:1px solid var(--line);border-radius:9px;background:#16233a;color:var(--text);padding:8px 11px;cursor:pointer}button:hover{background:#203454}button:disabled{opacity:.5;cursor:not-allowed}.messages{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}.empty{text-align:center;color:var(--muted);margin:auto;max-width:560px}.msg{max-width:85%;padding:13px 15px;border-radius:15px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.msg.user{align-self:flex-end;background:var(--blue);border-top-right-radius:3px}.msg.assistant{align-self:flex-start;background:#1e293b;border:1px solid var(--line);border-top-left-radius:3px}.msg-head{font-size:11px;color:#bfdbfe;margin-bottom:5px;font-weight:700}.msg.assistant .msg-head{color:#86efac}.composer{display:flex;gap:9px;padding:13px 16px;background:var(--panel2);border-top:1px solid var(--line)}input{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;background:#16233a;color:var(--text);padding:12px 14px;font-size:14px;outline:none}input:focus{border-color:#3b82f6}.send{background:var(--blue);font-weight:700}.notice{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:2;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#0f172a;box-shadow:0 8px 30px #0008;font-size:12px}.notice.error{border-color:#ef4444;color:#fecaca}.typing{color:#93c5fd}.hint{font-size:12px;color:var(--muted);margin-top:12px}.key{direction:ltr;display:inline-block;font-family:monospace;color:#bfdbfe}@media(max-width:600px){header{padding:10px}.messages{padding:14px}.msg{max-width:94%}.toolbar button{padding:7px 8px}.toolbar span{display:none}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
  (() => {
    'use strict';

    // Pollinations is a public, keyless AI gateway. Override it with
    // window.EDITOR_AI_ENDPOINT before this script if your deployment uses another gateway.
    const AI_ENDPOINT = window.EDITOR_AI_ENDPOINT || 'https://gen.pollinations.ai/v1/chat/completions';
    const AI_MODEL = window.EDITOR_AI_MODEL || 'openai';
    const STORE = 'editor-free-ai-chat-v1';
    const REQUEST_TIMEOUT = 45000;
    const state = { lang:'ar', messages:[], busy:false, notice:'' };
    const $ = (selector, root=document) => root.querySelector(selector);
    const uid = () => globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const isArabic = () => state.lang === 'ar';
    const t = (ar, en) => isArabic() ? ar : en;
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
      if (saved.lang === 'ar' || saved.lang === 'en') state.lang = saved.lang;
      if (Array.isArray(saved.messages)) state.messages = saved.messages.filter(m => m && (m.role === 'user' || m.role === 'assistant')).slice(-40);
    } catch (_) {}

    function save() {
      try { localStorage.setItem(STORE, JSON.stringify({lang:state.lang, messages:state.messages.slice(-40)})); } catch (_) {}
    }

    function showNotice(message, error=false) {
      state.notice = message;
      render();
      window.clearTimeout(showNotice.timer);
      showNotice.timer = window.setTimeout(() => { state.notice = ''; render(); }, 4500);
      if (error) console.error(message);
    }

    async function requestAI(prompt) {
      const history = state.messages
        .filter(m => (m.role === 'user' || m.role === 'assistant') && m.content)
        .slice(-12)
        .map(m => ({role:m.role, content:m.content}));
      const response = await fetchWithTimeout(AI_ENDPOINT, {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Accept':'application/json'},
        body:JSON.stringify({
          model: AI_MODEL,
          messages:[
            {role:'system', content:isArabic() ? 'أجب بالعربية مباشرة وبدقة. لا تضف مقدمات تسويقية.' : 'Answer directly and accurately in English. Do not add promotional introductions.'},
            ...history,
            {role:'user', content:prompt}
          ],
          temperature:0.7,
          max_tokens:1024,
          stream:false
        })
      }, REQUEST_TIMEOUT);
      const raw = await response.text();
      let data;
      try { data = raw ? JSON.parse(raw) : {}; } catch (_) { throw new Error(t('استجابة غير صالحة من خادم الذكاء الاصطناعي.', 'The AI server returned invalid JSON.')); }
      if (!response.ok) {
        const detail = data?.error?.message || data?.message || `${response.status} ${response.statusText}`;
        throw new Error(`${t('فشل الاتصال بالخادم:', 'AI server request failed:')} ${detail}`);
      }
      const answer = data?.choices?.[0]?.message?.content || data?.choices?.[0]?.text || data?.response || data?.output_text;
      if (typeof answer !== 'string' || !answer.trim()) throw new Error(t('لم يُرجع الخادم نصاً.', 'The AI server returned no text.'));
      return answer.trim();
    }

    async function fetchWithTimeout(url, options, timeout) {
      const controller = new AbortController();
      const timer = window.setTimeout(() => controller.abort(), timeout);
      try { return await fetch(url, {...options, signal:controller.signal}); }
      catch (error) {
        if (error?.name === 'AbortError') throw new Error(t('انتهت مهلة الاتصال بالخادم.', 'The AI request timed out.'));
        throw new Error(t('تعذر الاتصال بخادم الذكاء الاصطناعي. تحقق من الإنترنت أو سياسة CORS.', 'Could not connect to the AI server. Check your internet connection or CORS policy.'));
      } finally { window.clearTimeout(timer); }
    }

    async function send() {
      const input = $('#prompt');
      const prompt = input?.value.trim();
      if (!prompt || state.busy) return;
      state.busy = true;
      input.value = '';
      state.messages.push({id:uid(), role:'user', content:prompt});
      state.messages.push({id:uid(), role:'assistant', content:t('جاري الاتصال بخادم الذكاء الاصطناعي...', 'Connecting to the AI server...')});
      render();
      try {
        const answer = await requestAI(prompt);
        state.messages[state.messages.length - 1].content = answer;
      } catch (error) {
        state.messages[state.messages.length - 1].content = t('تعذر الحصول على إجابة.', 'Unable to get an answer.') + '\n\n' + (error?.message || String(error));
        showNotice(error?.message || String(error), true);
      } finally {
        state.busy = false;
        save();
        render();
        $('#prompt')?.focus();
      }
    }

    function render() {
      document.documentElement.lang = state.lang;
      document.documentElement.dir = isArabic() ? 'rtl' : 'ltr';
      document.title = t('مختبر EDITOR', 'EDITOR Lab');
      const messages = state.messages.length
        ? state.messages.map(m => `<article class="msg ${m.role}"><div class="msg-head">${m.role === 'user' ? t('أنت','You') : t('الذكاء الاصطناعي','AI')}</div><div>${escapeHtml(m.content)}</div></article>`).join('')
        : `<div class="empty"><h2>${t('مرحباً بك في مختبر EDITOR','Welcome to EDITOR Lab')}</h2><p>${t('محادثة مباشرة مع خادم ذكاء اصطناعي مجاني. اكتب سؤالك وابدأ.','Direct chat with a free AI server. Type a question to begin.')}</p><p class="hint">${t('الخادم المستخدم: Pollinations AI','AI server: Pollinations AI')}<br><span class="key">${escapeHtml(AI_ENDPOINT)}</span></p></div>`;
      $('#app').innerHTML = `<div class="app"><header><div class="logo">✦</div><div class="brand">${t('مختبر EDITOR','EDITOR Lab')}</div><div class="status">● ${t('متصل بالخادم المجاني','Free server')}</div><div class="toolbar"><button data-action="language">${t('EN / عربي','AR / English')}</button><button data-action="clear" ${state.messages.length ? '' : 'disabled'}>${t('مسح','Clear')}</button></div></header><main class="messages" id="messages">${messages}</main><form class="composer" id="composer"><input id="prompt" autocomplete="off" placeholder="${t('اكتب رسالتك هنا...','Type your message...')}" ${state.busy ? 'disabled' : ''}><button class="send" type="submit" ${state.busy ? 'disabled' : ''}>${state.busy ? '...' : t('إرسال','Send')}</button></form></div>${state.notice ? `<div class="notice error">${escapeHtml(state.notice)}</div>` : ''}`;
      $('#composer')?.addEventListener('submit', event => { event.preventDefault(); send(); });
      $('[data-action="language"]')?.addEventListener('click', () => { state.lang = isArabic() ? 'en' : 'ar'; save(); render(); });
      $('[data-action="clear"]')?.addEventListener('click', () => { if (!state.busy) { state.messages = []; save(); render(); } });
      const box = $('#messages'); if (box) box.scrollTop = box.scrollHeight;
    }

    render();
  })();
  </script>
</body>
</html>
